<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Promedio Escolar</title>
  <style>
    :root {
      --bg: #0F172A;
      --surface: #1E293B;
      --border: #334155;
      --text: #F1F5F9;
      --text-muted: #94A3B8;
      --primary: #3B82F6;
      --primary-hover: #2563EB;
      --success: #22C55E;
      --warning: #F59E0B;
      --danger: #EF4444;
      --radius: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      padding: 24px 16px 48px;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 32px;
      text-align: center;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }

    /* Notas */
    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .note-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 10px 12px;
      font-size: 1rem;
      font-variant-numeric: tabular-nums;
      width: 100%;
      transition: border-color 0.15s;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      opacity: 0.6;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 42px;
      height: 42px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .btn-icon:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn-icon svg {
      width: 18px;
      height: 18px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      width: 100%;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--text-muted);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .total-perc {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .total-perc span {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    .total-ok { color: var(--success); }
    .total-warn { color: var(--warning); }
    .total-over { color: var(--danger); }

    /* Objetivo */
    .target-section {
      margin-bottom: 8px;
    }

    /* Resultados */
    .results {
      display: none;
    }

    .results.visible {
      display: block;
    }

    .result-box {
      background: var(--bg);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .result-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .result-value {
      font-size: 1.75rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .result-message {
      font-size: 0.95rem;
      margin-top: 8px;
      line-height: 1.4;
    }

    .status-ok { color: var(--success); }
    .status-warn { color: var(--warning); }
    .status-danger { color: var(--danger); }

    .scale-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .scale-btn {
      flex: 1;
      padding: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.15s;
    }

    .scale-btn.active {
      background: rgba(59, 130, 246, 0.15);
      border-color: var(--primary);
      color: var(--primary);
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    @media (max-width: 480px) {
      .note-row {
        grid-template-columns: 1fr 1fr;
      }
      .btn-icon {
        grid-column: 1 / -1;
        width: 100%;
        height: 38px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Calculadora de Promedio Escolar</h1>
      <p>Calcula tu promedio ponderado y simula la nota que necesitas</p>
    </header>

    <!-- Escala -->
    <div class="card">
      <div class="card-title">Escala de notas</div>
      <div class="scale-toggle">
        <button class="scale-btn active" data-scale="10">0 – 10</button>
        <button class="scale-btn" data-scale="100">0 – 100</button>
      </div>
    </div>

    <!-- Notas -->
    <div class="card">
      <div class="card-title">Tus notas</div>
      <div class="notes-list" id="notesList"></div>
      <button class="btn btn-secondary" id="addNoteBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Añadir nota
      </button>
      <div class="total-perc">
        <span>Total porcentajes</span>
        <span id="totalPerc">0%</span>
      </div>
    </div>

    <!-- Objetivo -->
    <div class="card">
      <div class="card-title">Objetivo</div>
      <div class="field target-section">
        <label for="targetGrade">Nota mínima a la que aspiro</label>
        <input type="number" id="targetGrade" step="0.1" min="0" placeholder="Ej: 7.0" />
      </div>
      <button class="btn btn-primary" id="calculateBtn">Calcular / Simular</button>
    </div>

    <!-- Resultados -->
    <div class="card results" id="results">
      <div class="card-title">Resultados</div>
      
      <div class="result-box">
        <div class="result-label">Promedio actual</div>
        <div class="result-value" id="currentAverage">—</div>
      </div>

      <div class="result-box">
        <div class="result-label">Nota necesaria (porcentaje restante)</div>
        <div class="result-value" id="neededGrade">—</div>
        <div class="result-message" id="resultMessage"></div>
      </div>
    </div>

    <footer>
      Herramienta para estudiantes · Diseño formal oscuro
    </footer>
  </div>

  <script>
    // Estado
    let scaleMax = 10;
    let noteIdCounter = 0;

    const notesList = document.getElementById('notesList');
    const addNoteBtn = document.getElementById('addNoteBtn');
    const totalPercEl = document.getElementById('totalPerc');
    const calculateBtn = document.getElementById('calculateBtn');
    const resultsEl = document.getElementById('results');
    const currentAverageEl = document.getElementById('currentAverage');
    const neededGradeEl = document.getElementById('neededGrade');
    const resultMessageEl = document.getElementById('resultMessage');
    const targetGradeInput = document.getElementById('targetGrade');

    // Inicializar con 2 notas
    addNoteRow();
    addNoteRow();

    // Escala
    document.querySelectorAll('.scale-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        scaleMax = Number(btn.dataset.scale);
        // Actualizar placeholders y límites
        document.querySelectorAll('.note-grade').forEach(input => {
          input.max = scaleMax;
          input.placeholder = `0 – ${scaleMax}`;
        });
        targetGradeInput.max = scaleMax;
        targetGradeInput.placeholder = `Ej: ${scaleMax === 10 ? '7.0' : '70'}`;
      });
    });

    // Añadir nota
    addNoteBtn.addEventListener('click', () => addNoteRow());

    function addNoteRow(grade = '', perc = '') {
      const id = noteIdCounter++;
      const row = document.createElement('div');
      row.className = 'note-row';
      row.dataset.id = id;

      row.innerHTML = `
        <div class="field">
          <label>Nota</label>
          <input type="number" class="note-grade" step="0.1" min="0" max="${scaleMax}" 
                 placeholder="0 – ${scaleMax}" value="${grade}" />
        </div>
        <div class="field">
          <label>Porcentaje (%)</label>
          <input type="number" class="note-perc" step="0.1" min="0" max="100" 
                 placeholder="Ej: 20" value="${perc}" />
        </div>
        <button class="btn-icon" title="Eliminar nota" aria-label="Eliminar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      `;

      // Eliminar
      row.querySelector('.btn-icon').addEventListener('click', () => {
        if (notesList.children.length <= 1) return; // mínimo 1
        row.remove();
        updateTotalPerc();
      });

      // Actualizar total al cambiar
      row.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', updateTotalPerc);
      });

      notesList.appendChild(row);
      updateTotalPerc();
    }

    function updateTotalPerc() {
      const total = getNotes().reduce((sum, n) => sum + (n.perc || 0), 0);
      totalPercEl.textContent = total.toFixed(1) + '%';
      
      totalPercEl.classList.remove('total-ok', 'total-warn', 'total-over');
      if (total === 100) {
        totalPercEl.classList.add('total-ok');
      } else if (total > 100) {
        totalPercEl.classList.add('total-over');
      } else {
        totalPercEl.classList.add('total-warn');
      }
    }

    function getNotes() {
      const rows = notesList.querySelectorAll('.note-row');
      return Array.from(rows).map(row => ({
        grade: parseFloat(row.querySelector('.note-grade').value) || null,
        perc: parseFloat(row.querySelector('.note-perc').value) || 0
      }));
    }

    // Calcular
    calculateBtn.addEventListener('click', () => {
      const notes = getNotes();
      const target = parseFloat(targetGradeInput.value);

      // Validaciones básicas
      if (notes.every(n => n.grade === null)) {
        alert('Ingresa al menos una nota.');
        return;
      }
      if (isNaN(target) || target < 0 || target > scaleMax) {
        alert(`Ingresa una nota objetivo válida entre 0 y ${scaleMax}.`);
        return;
      }

      const totalPerc = notes.reduce((sum, n) => sum + n.perc, 0);
      const knownNotes = notes.filter(n => n.grade !== null);
      const knownWeight = knownNotes.reduce((sum, n) => sum + (n.grade * n.perc), 0);
      const knownPerc = knownNotes.reduce((sum, n) => sum + n.perc, 0);

      // Promedio actual (solo con las notas que ya tienen valor)
      let currentAvg = null;
      if (knownPerc > 0) {
        currentAvg = knownWeight / knownPerc;
      }

      // Porcentaje restante
      const remainingPerc = 100 - totalPerc;

      let needed = null;
      let message = '';
      let statusClass = '';

      if (totalPerc > 100) {
        message = 'La suma de porcentajes supera el 100%. Ajusta los valores.';
        statusClass = 'status-danger';
        neededGradeEl.textContent = '—';
      } else if (remainingPerc <= 0) {
        // Ya está completo
        const finalAvg = knownWeight / 100;
        currentAvg = finalAvg;
        neededGradeEl.textContent = '—';
        if (finalAvg >= target) {
          message = `Ya alcanzaste el objetivo. Tu promedio final es ${finalAvg.toFixed(2)}.`;
          statusClass = 'status-ok';
        } else {
          message = `No es posible alcanzar ${target}. Tu promedio final es ${finalAvg.toFixed(2)}.`;
          statusClass = 'status-danger';
        }
      } else {
        // Despejar la ecuación
        // target * 100 = knownWeight + (needed * remainingPerc)
        needed = (target * 100 - knownWeight) / remainingPerc;

        if (needed > scaleMax) {
          message = `Imposible alcanzar ${target}. Necesitarías un ${needed.toFixed(2)} (máximo ${scaleMax}).`;
          statusClass = 'status-danger';
        } else if (needed < 0) {
          message = `Ya superaste el objetivo. Incluso con 0 en el resto obtendrías más de ${target}.`;
          statusClass = 'status-ok';
          needed = 0;
        } else {
          message = `Necesitas obtener al menos un <strong>${needed.toFixed(2)}</strong> en el ${remainingPerc.toFixed(1)}% restante para llegar a ${target}.`;
          statusClass = needed <= scaleMax * 0.7 ? 'status-ok' : (needed <= scaleMax * 0.85 ? 'status-warn' : 'status-danger');
        }
      }

      // Mostrar resultados
      currentAverageEl.textContent = currentAvg !== null ? currentAvg.toFixed(2) : '—';
      neededGradeEl.textContent = needed !== null ? needed.toFixed(2) : '—';
      resultMessageEl.innerHTML = message;
      resultMessageEl.className = 'result-message ' + statusClass;

      resultsEl.classList.add('visible');
      resultsEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  </script>
</body>
</html>
