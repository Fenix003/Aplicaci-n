<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Promedio Escolar</title>
  <style>
    :root {
      --bg: #0F172A;
      --surface: #1E293B;
      --border: #334155;
      --text: #F1F5F9;
      --text-muted: #94A3B8;
      --primary: #3B82F6;
      --primary-hover: #2563EB;
      --success: #22C55E;
      --warning: #F59E0B;
      --danger: #EF4444;
      --radius: 8px;
    }

    /* Temas */
    body.theme-light {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --text: #0F172A;
      --text-muted: #64748B;
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
    }
    body.theme-green {
      --bg: #0C1A14;
      --surface: #142920;
      --border: #1E3A2F;
      --text: #E8F5E9;
      --text-muted: #81C784;
      --primary: #22C55E;
      --primary-hover: #16A34A;
    }
    body.theme-purple {
      --bg: #1A1025;
      --surface: #2A1B3D;
      --border: #3D2A5C;
      --text: #F3E8FF;
      --text-muted: #C4B5FD;
      --primary: #A855F7;
      --primary-hover: #9333EA;
    }
    body.theme-orange {
      --bg: #1C140A;
      --surface: #2A1F12;
      --border: #3D2E1A;
      --text: #FFF7ED;
      --text-muted: #FDBA74;
      --primary: #F97316;
      --primary-hover: #EA580C;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      padding: 12px 12px 40px; /* menos espacio arriba y laterales */
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 18px; /* menos espacio */
      text-align: center;
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 4px;
    }
    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }
    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }
    .note-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: end;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .field label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 9px 11px;
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
      width: 100%;
      transition: border-color 0.15s;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 25%, transparent);
    }
    .btn-icon {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 40px;
      height: 40px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .btn-icon:hover {
      background: color-mix(in srgb, var(--danger) 15%, transparent);
      border-color: var(--danger);
      color: var(--danger);
    }
    .btn-icon svg {
      width: 17px;
      height: 17px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      width: 100%;
    }
    .btn-secondary:hover {
      background: color-mix(in srgb, var(--text) 6%, transparent);
      border-color: var(--text-muted);
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      width: 100%;
      padding: 13px;
      font-size: 1rem;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .total-perc {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 0.88rem;
    }
    .total-perc span {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .total-ok { color: var(--success); }
    .total-warn { color: var(--warning); }
    .total-over { color: var(--danger); }

    .results {
      display: none;
    }
    .results.visible {
      display: block;
    }
    .result-box {
      background: var(--bg);
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .result-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    .result-value {
      font-size: 1.65rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .result-message {
      font-size: 0.92rem;
      margin-top: 6px;
      line-height: 1.4;
    }
    .status-ok { color: var(--success); }
    .status-warn { color: var(--warning); }
    .status-danger { color: var(--danger); }

    .scale-toggle, .theme-toggle {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .scale-btn, .theme-btn {
      flex: 1;
      min-width: 70px;
      padding: 7px 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      transition: all 0.15s;
    }
    .scale-btn.active, .theme-btn.active {
      background: color-mix(in srgb, var(--primary) 18%, transparent);
      border-color: var(--primary);
      color: var(--primary);
    }

    footer {
      text-align: center;
      margin-top: 28px;
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    @media (max-width: 480px) {
      .note-row {
        grid-template-columns: 1fr 1fr;
      }
      .btn-icon {
        grid-column: 1 / -1;
        width: 100%;
        height: 36px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Calculadora de Promedio Escolar</h1>
      <p>Calcula tu promedio ponderado y simula la nota que necesitas</p>
    </header>

    <!-- Tema -->
    <div class="card">
      <div class="card-title">Paleta de colores</div>
      <div class="theme-toggle">
        <button class="theme-btn active" data-theme="dark">Oscuro</button>
        <button class="theme-btn" data-theme="light">Claro</button>
        <button class="theme-btn" data-theme="green">Verde</button>
        <button class="theme-btn" data-theme="purple">Púrpura</button>
        <button class="theme-btn" data-theme="orange">Naranja</button>
      </div>
    </div>

    <!-- Escala -->
    <div class="card">
      <div class="card-title">Escala de notas</div>
      <div class="scale-toggle">
        <button class="scale-btn active" data-scale="10">0 – 10</button>
        <button class="scale-btn" data-scale="5">0 – 5</button>
        <button class="scale-btn" data-scale="100">0 – 100</button>
      </div>
    </div>

    <!-- Notas -->
    <div class="card">
      <div class="card-title">Tus notas</div>
      <div class="notes-list" id="notesList"></div>
      <button class="btn btn-secondary" id="addNoteBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Añadir nota
      </button>
      <div class="total-perc">
        <span>Total porcentajes</span>
        <span id="totalPerc">0%</span>
      </div>
    </div>

    <!-- Objetivo (opcional) -->
    <div class="card">
      <div class="card-title">Objetivo (opcional)</div>
      <div class="field" style="margin-bottom: 12px;">
        <label for="targetGrade">Nota mínima a la que aspiro (déjalo vacío si solo quieres el promedio)</label>
        <input type="number" id="targetGrade" step="0.1" min="0" placeholder="Ej: 7.0 (opcional)" />
      </div>
      <button class="btn btn-primary" id="calculateBtn">Calcular</button>
    </div>

    <!-- Resultados -->
    <div class="card results" id="results">
      <div class="card-title">Resultados</div>
      
      <div class="result-box">
        <div class="result-label">Promedio actual</div>
        <div class="result-value" id="currentAverage">—</div>
      </div>
      <div class="result-box" id="neededBox">
        <div class="result-label">Nota necesaria (porcentaje restante)</div>
        <div class="result-value" id="neededGrade">—</div>
        <div class="result-message" id="resultMessage"></div>
      </div>
    </div>

    <footer>
      Herramienta para estudiantes · Diseño formal
    </footer>
  </div>

  <script>
    // Estado
    let scaleMax = 10;
    let noteIdCounter = 0;
    const notesList = document.getElementById('notesList');
    const addNoteBtn = document.getElementById('addNoteBtn');
    const totalPercEl = document.getElementById('totalPerc');
    const calculateBtn = document.getElementById('calculateBtn');
    const resultsEl = document.getElementById('results');
    const currentAverageEl = document.getElementById('currentAverage');
    const neededGradeEl = document.getElementById('neededGrade');
    const resultMessageEl = document.getElementById('resultMessage');
    const neededBox = document.getElementById('neededBox');
    const targetGradeInput = document.getElementById('targetGrade');

    // Inicializar con 2 notas
    addNoteRow();
    addNoteRow();

    // Temas
    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const theme = btn.dataset.theme;
        document.body.className = theme === 'dark' ? '' : `theme-${theme}`;
      });
    });

    // Escala
    document.querySelectorAll('.scale-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        scaleMax = Number(btn.dataset.scale);
        document.querySelectorAll('.note-grade').forEach(input => {
          input.max = scaleMax;
          input.placeholder = `0 – ${scaleMax}`;
        });
        targetGradeInput.max = scaleMax;
        targetGradeInput.placeholder = `Ej: ${scaleMax === 10 ? '7.0' : (scaleMax === 5 ? '3.5' : '70')} (opcional)`;
      });
    });

    // Añadir nota
    addNoteBtn.addEventListener('click', () => addNoteRow());

    function addNoteRow(grade = '', perc = '') {
      const id = noteIdCounter++;
      const row = document.createElement('div');
      row.className = 'note-row';
      row.dataset.id = id;
      row.innerHTML = `
        <div class="field">
          <label>Nota</label>
          <input type="number" class="note-grade" step="0.1" min="0" max="${scaleMax}" 
                 placeholder="0 – ${scaleMax}" value="${grade}" />
        </div>
        <div class="field">
          <label>Porcentaje (%)</label>
          <input type="number" class="note-perc" step="0.1" min="0" max="100" 
                 placeholder="Ej: 20" value="${perc}" />
        </div>
        <button class="btn-icon" title="Eliminar nota" aria-label="Eliminar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      `;
      row.querySelector('.btn-icon').addEventListener('click', () => {
        if (notesList.children.length <= 1) return;
        row.remove();
        updateTotalPerc();
      });
      row.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', updateTotalPerc);
      });
      notesList.appendChild(row);
      updateTotalPerc();
    }

    function updateTotalPerc() {
      const total = getNotes().reduce((sum, n) => sum + (n.perc || 0), 0);
      totalPercEl.textContent = total.toFixed(1) + '%';
      totalPercEl.classList.remove('total-ok', 'total-warn', 'total-over');
      if (total === 100) {
        totalPercEl.classList.add('total-ok');
      } else if (total > 100) {
        totalPercEl.classList.add('total-over');
      } else {
        totalPercEl.classList.add('total-warn');
      }
    }

    function getNotes() {
      const rows = notesList.querySelectorAll('.note-row');
      return Array.from(rows).map(row => ({
        grade: parseFloat(row.querySelector('.note-grade').value) || null,
        perc: parseFloat(row.querySelector('.note-perc').value) || 0
      }));
    }

    // Calcular
    calculateBtn.addEventListener('click', () => {
      const notes = getNotes();
      const targetRaw = targetGradeInput.value.trim();
      const hasTarget = targetRaw !== '';
      const target = hasTarget ? parseFloat(targetRaw) : null;

      if (notes.every(n => n.grade === null)) {
        alert('Ingresa al menos una nota.');
        return;
      }

      if (hasTarget && (isNaN(target) || target < 0 || target > scaleMax)) {
        alert(`Ingresa una nota objetivo válida entre 0 y ${scaleMax}, o déjala vacía.`);
        return;
      }

      const totalPerc = notes.reduce((sum, n) => sum + n.perc, 0);
      const knownNotes = notes.filter(n => n.grade !== null);
      const knownWeight = knownNotes.reduce((sum, n) => sum + (n.grade * n.perc), 0);
      const knownPerc = knownNotes.reduce((sum, n) => sum + n.perc, 0);

      // Promedio actual (siempre se calcula con las notas que tienen valor)
      let currentAvg = null;
      if (knownPerc > 0) {
        currentAvg = knownWeight / knownPerc;
      }

      // Si no hay objetivo → solo mostrar promedio
      if (!hasTarget) {
        currentAverageEl.textContent = currentAvg !== null ? currentAvg.toFixed(2) : '—';
        neededBox.style.display = 'none';
        resultMessageEl.innerHTML = '';
        resultsEl.classList.add('visible');
        resultsEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        return;
      }

      // Hay objetivo → lógica de simulación
      neededBox.style.display = 'block';
      const remainingPerc = 100 - totalPerc;
      let needed = null;
      let message = '';
      let statusClass = '';

      if (totalPerc > 100) {
        message = 'La suma de porcentajes supera el 100%. Ajusta los valores.';
        statusClass = 'status-danger';
        neededGradeEl.textContent = '—';
      } else if (remainingPerc <= 0) {
        const finalAvg = knownWeight / 100;
        currentAvg = finalAvg;
        neededGradeEl.textContent = '—';
        if (finalAvg >= target) {
          message = `Ya alcanzaste el objetivo. Tu promedio final es ${finalAvg.toFixed(2)}.`;
          statusClass = 'status-ok';
        } else {
          message = `No es posible alcanzar ${target}. Tu promedio final es ${finalAvg.toFixed(2)}.`;
          statusClass = 'status-danger';
        }
      } else {
        needed = (target * 100 - knownWeight) / remainingPerc;
        if (needed > scaleMax) {
          message = `Imposible alcanzar ${target}. Necesitarías un ${needed.toFixed(2)} (máximo ${scaleMax}).`;
          statusClass = 'status-danger';
        } else if (needed < 0) {
          message = `Ya superaste el objetivo. Incluso con 0 en el resto obtendrías más de ${target}.`;
          statusClass = 'status-ok';
          needed = 0;
        } else {
          message = `Necesitas obtener al menos un <strong>${needed.toFixed(2)}</strong> en el ${remainingPerc.toFixed(1)}% restante para llegar a ${target}.`;
          statusClass = needed <= scaleMax * 0.7 ? 'status-ok' : (needed <= scaleMax * 0.85 ? 'status-warn' : 'status-danger');
        }
      }

      currentAverageEl.textContent = currentAvg !== null ? currentAvg.toFixed(2) : '—';
      neededGradeEl.textContent = needed !== null ? needed.toFixed(2) : '—';
      resultMessageEl.innerHTML = message;
      resultMessageEl.className = 'result-message ' + statusClass;
      resultsEl.classList.add('visible');
      resultsEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  </script>
</body>
</html>
